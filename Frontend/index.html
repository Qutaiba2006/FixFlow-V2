<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="fixflow-workspace" content="fixflow" />
    <meta name="theme-color" content="#214d3d" />
    <script>
      // Resolve before styles and React load, including when storage is unavailable.
      (() => {
        let preference = 'system';
        try {
          const saved = localStorage.getItem('fixflow-experiment-theme');
          if (saved === 'light' || saved === 'dark') preference = saved;
        } catch { /* The system preference still works without storage. */ }
        const theme = preference === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#101b17' : '#f8f9f5';
      })();
    </script>
    <style>
      html { background: #f8f9f5; }
      html[data-theme="dark"] { background: #101b17; color: #e3eddf; }
    </style>
    <meta name="description" content="A better campus starts with someone noticing. Report issues, support your community, and follow every fix with FixFlow." />
    <title>FixFlow — A little care. A better campus.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
